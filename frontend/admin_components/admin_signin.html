<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In</title>
    <link rel="icon" type="image/png" href="/Images/Logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="bg-green-50 flex flex-col justify-center items-center min-h-screen relative py-10 px-4">

    <div class="bg-white shadow-lg rounded-xl p-6 md:p-10 w-full max-w-md z-10">
        <div class="text-center mb-8">
            <img src="/Images/Logo.png" alt="Logo" class="w-24 h-24 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-green-900">Admin Portal</h1>
            <p class="text-green-700 text-sm">Sign in to manage your barangay</p>
        </div>

        <form id="adminForm" class="space-y-6">
            <div>
                <label for="username" class="block text-green-900 font-medium mb-1">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required
                       class="w-full border border-green-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-700 transition">
            </div>

            <div>
                <label for="password" class="block text-green-900 font-medium mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                           class="w-full border border-green-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-700 pr-10 transition">
                    <i id="togglePassword" class="fa-solid fa-eye-slash absolute right-3 top-2.5 cursor-pointer text-green-700 hover:text-green-600 transition"></i>
                </div>
                <div class="text-right mt-2">
                    <button type="button" id="forgotPasswordBtn" class="text-sm text-green-600 hover:text-green-800 hover:underline transition">
                        Forgot Password?
                    </button>
                </div>
            </div>

            <div id="loginError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4"></div>

            <div>
                <button type="submit" 
                        class="w-full bg-green-800 text-white font-bold px-4 py-2.5 rounded-lg hover:bg-green-700 transition shadow-md">
                    Sign In
                </button>
            </div>
        </form>

        <p class="text-sm text-center text-green-900 mt-6">
            Back to <a href="../index.html" class="text-green-700 hover:underline font-semibold">Home</a>
        </p>
    </div>

    <div id="recoveryModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden transform transition-all scale-100">
            
            <div class="bg-green-900 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-shield-halved mr-2"></i>Account Recovery</h3>
                <button id="closeModal" class="text-green-200 hover:text-white transition"><i class="fa-solid fa-times text-xl"></i></button>
            </div>

            <div id="recoveryError" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4"></div>

            <div id="stepUsername" class="p-6 space-y-4">
                <div class="text-center">
                    <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fa-solid fa-user text-2xl text-blue-700"></i>
                    </div>
                    <p class="text-gray-600 text-sm">Please enter your <strong>Admin Username</strong> to proceed with account recovery.</p>
                </div>

                <div>
                    <input type="text" id="recoveryUsername" placeholder="Enter your username" autocomplete="off"
                           class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 transition">
                </div>

                <button id="verifyUsernameBtn" class="w-full bg-blue-700 text-white font-bold py-2 rounded-lg hover:bg-blue-800 transition">
                    Continue
                </button>
            </div>

            <div id="stepVerify" class="p-6 space-y-4 hidden">
                <div class="text-center">
                    <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fa-solid fa-lock text-2xl text-green-700"></i>
                    </div>
                    <p class="text-gray-600 text-sm">Please enter the <strong>4-Digit Master PIN</strong> provided during system setup to reset your password.</p>
                </div>

                <div>
                    <input type="password" id="recoveryPin" maxlength="4" placeholder="• • • •" autocomplete="off"
                           class="w-full text-center text-2xl tracking-widest border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-green-500 font-mono transition">
                </div>

                <button id="verifyPinBtn" class="w-full bg-green-700 text-white font-bold py-2 rounded-lg hover:bg-green-800 transition">
                    Verify PIN
                </button>
            </div>

            <div id="stepReset" class="p-6 space-y-4 hidden">
                <div class="text-center mb-2">
                    <i class="fa-solid fa-check-circle text-4xl text-green-600 mb-2"></i>
                    <h4 class="font-bold text-gray-800">PIN Verified!</h4>
                    <p class="text-xs text-gray-500">Set your new password below.</p>
                </div>

                <div class="space-y-3">
                    <div class="relative">
                        <input type="password" id="newRecPass" placeholder="New Password" autocomplete="new-password"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 pr-10">
                        <i id="toggleNewPass" class="fa-solid fa-eye-slash absolute right-3 top-2.5 cursor-pointer text-green-700 hover:text-green-600 transition"></i>
                    </div>
                    <div class="relative">
                        <input type="password" id="confirmRecPass" placeholder="Confirm Password" autocomplete="new-password"
                               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 pr-10">
                        <i id="toggleConfirmPass" class="fa-solid fa-eye-slash absolute right-3 top-2.5 cursor-pointer text-green-700 hover:text-green-600 transition"></i>
                    </div>
                </div>

                <button id="saveNewPassBtn" class="w-full bg-green-700 text-white font-bold py-2 rounded-lg hover:bg-green-800 transition mt-2">
                    Update Password
                </button>
            </div>

        </div>
    </div>

    <script src="../js/core/auth.js"></script>
    <script type="module" src="../js/controllers/signin.js"></script>
</body>
</html>
