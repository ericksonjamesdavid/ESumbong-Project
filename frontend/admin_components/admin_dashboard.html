<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>

  <link rel="icon" type="image/png" href="/Images/Logo.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    /* Tab Styles */
    .active-tab {
      background-color: white !important;
      color: #166534 !important;
      border-bottom-color: #166534 !important;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen bg-gray-100">

  <main class="p-4 md:p-6 w-full space-y-6 mt-20 md:mt-24">

    <div
      class="bg-white outline outline-1 outline-gray-300 shadow-lg rounded-xl p-6 flex flex-col md:flex-row items-center md:justify-between gap-4">
      <div>
        <h2 class="text-xl font-semibold text-green-900 mb-2">Welcome, Admin!</h2>
        <p class="text-gray-700">Manage reports, announcements, and track submitted issues efficiently.</p>
      </div>
      <div class="text-center md:text-right">
        <img src="/Images/Logo.png" alt="Barangay Logo" class="w-16 h-16 md:w-20 md:h-20 rounded-full mx-auto md:mx-0">
      </div>
    </div>

    <section id="sectionAnnouncements"></section>

    <section id="sectionCharts" class="hidden"></section>

    <section id="sectionReports" class="hidden"></section>

    <section id="sectionAuditLog" class="hidden"></section>

    <section id="sectionSuggestions" class="hidden"></section>

  </main>

  <div id="modals-placeholder"></div>

  <footer class="bg-green-900 text-white text-center py-6 mt-auto">
    <p>&copy; 2025 Barangay Reporting System. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>

  <!-- Core Authentication & Utilities -->
  <script src="../js/core/auth.js"></script>
  <script src="../js/logo_data.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/admin_loader.js"></script>
  <script src="../js/utils/headerLoader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadHeaderSidebar('Admin Dashboard');
    });
  </script>

  <!-- Main Dashboard Controller (ES6 Module) -->
  <script type="module" src="../js/controllers/dashboard.js"></script>

</body>

</html>
