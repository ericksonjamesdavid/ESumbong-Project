<section id="sectionCharts">
      <div class="bg-white w-full mb-24 mt-10 shadow-xl rounded-2xl border border-gray-100 p-4 md:p-12">

        <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-8 text-center tracking-tight">
          Reports Overview
        </h1>

        <div
          class="flex flex-col md:flex-row gap-4 mb-10 justify-center items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
          <div class="flex items-center gap-2">
            <i class="fas fa-calendar-alt text-green-700"></i>
            <label for="filterYear" class="font-bold text-gray-700">Year:</label>
            <select id="filterYear"
              class="border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
              <option value="all">All</option>
              <option value="2025">2025</option>
              <option value="2024">2024</option>
              <option value="2023">2023</option>
            </select>
          </div>

          <div class="hidden md:block w-px h-6 bg-gray-300"></div>

          <div class="flex items-center gap-2">
            <i class="fas fa-filter text-green-700"></i>
            <label for="filterMonth" class="font-bold text-gray-700">Month:</label>
            <select id="filterMonth"
              class="border border-gray-300 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-green-500 bg-white">
              <option value="all">All</option>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
          </div>

          <button id="clearFiltersBtn"
            class="px-4 py-1.5 text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded transition text-sm flex items-center gap-2">
            <i class="fas fa-undo text-xs"></i> Clear
          </button>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 mb-12">
          <div
            class="bg-white p-4 md:p-6 rounded-xl border-t-4 border-red-500 shadow-sm hover:shadow-md transition text-center group">
            <div
              class="bg-red-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-red-100 transition">
              <i class="fas fa-exclamation-circle text-red-500 text-xl"></i>
            </div>
            <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Total Reported</div>
            <div class="text-4xl font-extrabold text-gray-800" id="reportedTotal">0</div>
          </div>

          <div
            class="bg-white p-4 md:p-6 rounded-xl border-t-4 border-green-500 shadow-sm hover:shadow-md transition text-center group">
            <div
              class="bg-green-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-green-100 transition">
              <i class="fas fa-check-circle text-green-500 text-xl"></i>
            </div>
            <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Total Solved</div>
            <div class="text-4xl font-extrabold text-gray-800" id="solvedTotal">0</div>
          </div>

          <div class="col-span-2 md:col-span-1 bg-white p-4 md:p-6 rounded-xl border-t-4 border-blue-500 shadow-sm hover:shadow-md transition text-center group">
            <div
              class="bg-blue-50 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:bg-blue-100 transition">
              <i class="fas fa-chart-line text-blue-500 text-xl"></i>
            </div>
            <div class="text-gray-500 text-xs font-bold uppercase tracking-wider mb-1">Resolution Rate</div>
            <div class="text-4xl font-extrabold text-gray-800" id="resolvedPercent">0%</div>
          </div>
        </div>

        <div id="noReportsMessage"
          class="hidden bg-white p-6 md:p-8 rounded-xl shadow-md border border-gray-100 text-center">
          <i class="fas fa-info-circle text-gray-400 text-5xl mb-4"></i>
          <h2 class="text-xl font-bold text-gray-800 mb-2">No Data Available</h2>
          <p class="text-gray-600">No reports match the selected filters. Try adjusting your year or month selection.
          </p>
        </div>

        <div id="chartsContainer" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b pb-2">
              <i class="fas fa-chart-bar text-green-700 mr-2"></i> Reports
            </h2>
            <div class="relative w-full h-80 flex justify-center items-center">
              <canvas id="barChart"></canvas>
            </div>
          </div>

          <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
            <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center border-b pb-2">
              <i class="fas fa-chart-pie text-green-700 mr-2"></i> Issue Types
            </h2>
            <div class="relative w-full h-64 flex justify-center items-center">
              <canvas id="pieChart"></canvas>
            </div>
            <ul id="legendList" class="mt-6 space-y-2 text-sm text-gray-600 pl-4 border-l-2 border-gray-100"></ul>
          </div>
        </div>
      </div>
    </section>
